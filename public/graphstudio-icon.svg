<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <style>
      .node { fill: none; stroke: currentColor; stroke-width: 2; opacity: 0.8; }
      .connection { stroke: currentColor; stroke-width: 1.5; opacity: 0.6; }
      .primary-node { fill: currentColor; opacity: 0.9; }
    </style>
  </defs>
  
  <!-- Connections -->
  <line class="connection" x1="8" y1="12" x2="16" y2="8" />
  <line class="connection" x1="8" y1="12" x2="12" y2="20" />
  <line class="connection" x1="16" y1="8" x2="24" y2="12" />
  <line class="connection" x1="16" y1="8" x2="20" y2="20" />
  <line class="connection" x1="24" y1="12" x2="20" y2="20" />
  <line class="connection" x1="12" y1="20" x2="20" y2="20" />
  <line class="connection" x1="12" y1="20" x2="16" y2="24" />
  <line class="connection" x1="20" y1="20" x2="16" y2="24" />
  
  <!-- Nodes -->
  <circle class="node" cx="8" cy="12" r="3" />
  <circle class="node primary-node" cx="16" cy="8" r="2.5" />
  <circle class="node" cx="24" cy="12" r="3" />
  <circle class="node" cx="12" cy="20" r="2.5" />
  <circle class="node" cx="20" cy="20" r="2.5" />
  <circle class="node primary-node" cx="16" cy="24" r="2" />
</svg> 